[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-os"
version = "0.1.0"
description = "LAYA OS - Intelligence Within: An AI-Native, Voice-First Linux Operating System"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "LAYA OS Core Team", email = "core@laya-os.org"}
]
keywords = [
    "operating-system",
    "linux",
    "ai-native",
    "voice-assistant",
    "tamil",
    "tanglish",
    "gtk4",
    "libadwaita",
    "wayland"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "psutil>=5.9.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
desktop = [
    "PyGObject>=3.46.0",
    "PySide6>=6.6.0",
]
voice = [
    "SpeechRecognition>=3.10.0",
    "pyaudio>=0.2.14",
    "edge-tts>=6.1.9",
    "pydub>=0.25.1",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
laya-core = "laya.main:main"
laya-dbus = "system.dbus.service:main"
laya-desktop = "desktop.shell.main:main"
laya-launcher = "desktop.launcher.main:main"
laya-dock = "desktop.dock.main:main"
laya-settings = "desktop.settings.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["laya*", "desktop*", "system*"]
exclude = ["tests*", "docs*", "scripts*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
    "laya",
    "desktop",
    "system"
]
