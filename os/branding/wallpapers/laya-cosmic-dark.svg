<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="nebulaViolet" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6D28D9" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#111429" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#090B18" stop-opacity="1.0" />
    </radialGradient>
    <radialGradient id="nebulaCyan" cx="25%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#111429" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#090B18" stop-opacity="1.0" />
    </radialGradient>
    <linearGradient id="gridLines" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- Deep Midnight Navy Base -->
  <rect width="3840" height="2160" fill="#090B18" />

  <!-- Atmospheric Cosmic Nebulae -->
  <rect width="3840" height="2160" fill="url(#nebulaViolet)" />
  <rect width="3840" height="2160" fill="url(#nebulaCyan)" style="mix-blend-mode: screen;" />

  <!-- Geometric Neural Constellation & Wave Lines -->
  <g stroke="url(#gridLines)" stroke-width="1.5">
    <path d="M 0 1080 Q 960 700 1920 1080 T 3840 1080" fill="none" />
    <path d="M 0 1200 Q 960 1500 1920 1200 T 3840 1200" fill="none" />
    <path d="M 0 950 Q 1440 600 2880 1250 T 3840 950" fill="none" />
    <path d="M 960 0 L 1920 1080 L 2880 0" fill="none" />
    <path d="M 960 2160 L 1920 1080 L 2880 2160" fill="none" />
  </g>

  <!-- Central Laya OS Logo Monogram Watermark -->
  <g transform="translate(1620, 780) scale(1.2)" opacity="0.35">
    <circle cx="256" cy="256" r="160" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="12 6" />
    <path d="M 140 256 A 116 116 0 1 1 372 256" fill="none" stroke="#22D3EE" stroke-width="8" stroke-linecap="round" />
    <path d="M 216 168 L 216 332 L 316 332" fill="none" stroke="#F8FAFC" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="316" cy="332" r="10" fill="#22D3EE" />
  </g>

  <!-- Tagline Text -->
  <text x="1920" y="1480" font-family="'Inter', 'Ubuntu', sans-serif" font-size="28" font-weight="300" letter-spacing="12" fill="#F8FAFC" fill-opacity="0.4" text-anchor="middle">
    LAYA OS  ·  INTELLIGENCE WITHIN
  </text>
</svg>
